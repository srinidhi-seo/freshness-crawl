# .github/workflows/daily-crawl.yml
# Runs the EEAT crawler every day, commits the fresh data.json + history snapshot,
# and publishes the dashboard to GitHub Pages.
#
# This is the piece that makes the dashboard "update every day" without anyone
# pressing a button. GitHub runs it on the schedule below on their infrastructure.

name: BikeDekho EEAT Daily Crawl

on:
  schedule:
    - cron: "30 1 * * *"   # 01:30 UTC = 07:00 IST every day. Adjust as needed.
  workflow_dispatch: {}     # also lets you trigger a run manually from the Actions tab

permissions:
  contents: write           # needed to commit the refreshed data back to the repo
  pages: write
  id-token: write

# Never let a slow run overlap the next day's run (prevents half-written data files).
concurrency:
  group: eeat-daily
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned versions so a future library release can't silently break a 3am run.
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run crawler
        run: |
          python bikedekho_eeat_crawler.py --sitemap https://www.bikedekho.com/BikeModel.xml --workers 6 --delay 0.8

      # Keep the day-by-day history folder from growing without bound (~90 days).
      - name: Prune history older than 90 days
        run: ls -1t data/history/*.json 2>/dev/null | tail -n +91 | xargs -r rm -- || true

      # Safe commit: a real no-change day stays green; a genuine push failure goes
      # red so GitHub emails you. The rebase guards against a human commit landing
      # between this job's checkout and its push.
      # Push the freshly-crawled data. Data files are regenerated wholesale each run,
      # so there's no meaningful merge with the previous run — today's data replaces
      # yesterday's. We copy our fresh data aside, hard-sync to remote main, copy our
      # data back on top, then commit & push (retrying if the remote moved again).
      # No rebase, no merge, so the add/add conflicts that broke the run can't occur.
      - name: Commit refreshed data
        run: |
          git config user.name  "eeat-bot"
          git config user.email "eeat-bot@users.noreply.github.com"
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "No changes to commit"; exit 0
          fi
          # 1) Stash our generated data outside git's view.
          rm -rf /tmp/crawl-data && cp -r data /tmp/crawl-data
          for attempt in 1 2 3 4 5; do
            # 2) Get exactly what's on the server right now.
            git fetch origin main
            git reset --hard origin/main
            # 3) Lay our fresh data back on top (ours always win — newest crawl wins).
            rm -rf data && cp -r /tmp/crawl-data data
            git add data/
            if git diff --cached --quiet; then
              echo "No net change after sync"; exit 0
            fi
            git commit -m "Daily EEAT crawl: $(date -u +%F)"
            # 4) Push; if the remote moved between fetch and push, loop and redo.
            if git push origin HEAD:main; then
              echo "Pushed on attempt $attempt"; exit 0
            fi
            echo "Push race on attempt $attempt — retrying"; sleep 3
          done
          echo "::error::Could not push after 5 attempts"; exit 1

      # ---- Publish dashboard.html + data.json as a live site ----
      - name: Stage site
        run: |
          mkdir -p _site
          cp dashboard.html _site/index.html
          cp data/data.json _site/data.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: crawl
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
