# .github/workflows/daily-crawl.yml
# Runs the EEAT crawler every day, commits the fresh data.json + history snapshot,
# and publishes the dashboard to GitHub Pages.
#
# This is the piece that makes the dashboard "update every day" without anyone
# pressing a button. GitHub runs it on the schedule below on their infrastructure.

name: BikeDekho EEAT Daily Crawl

on:
  schedule:
    - cron: "30 1 * * *"   # 01:30 UTC = 07:00 IST every day. Adjust as needed.
  workflow_dispatch: {}     # also lets you trigger a run manually from the Actions tab

permissions:
  contents: write           # needed to commit the refreshed data back to the repo
  pages: write
  id-token: write

# Never let a slow run overlap the next day's run (prevents half-written data files).
concurrency:
  group: eeat-daily
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned versions so a future library release can't silently break a 3am run.
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run crawler
        run: |
          python bikedekho_eeat_crawler.py --sitemap https://www.bikedekho.com/BikeModel.xml --workers 6 --delay 0.8

      # Keep the day-by-day history folder from growing without bound (~90 days).
      - name: Prune history older than 90 days
        run: ls -1t data/history/*.json 2>/dev/null | tail -n +91 | xargs -r rm -- || true

      # Safe commit: a real no-change day stays green; a genuine push failure goes
      # red so GitHub emails you. The rebase guards against a human commit landing
      # between this job's checkout and its push.
      - name: Commit refreshed data
        run: |
          git config user.name  "eeat-bot"
          git config user.email "eeat-bot@users.noreply.github.com"
          git add data/ || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily EEAT crawl: $(date -u +%F)"
            git pull --rebase --autostash || true
            git push
          fi

      # ---- Publish dashboard.html + data.json as a live site ----
      - name: Stage site
        run: |
          mkdir -p _site
          cp dashboard.html _site/index.html
          cp data/data.json _site/data.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: crawl
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
